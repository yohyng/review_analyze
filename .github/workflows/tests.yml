name: tests

# Run the test suite on every push and PR so regressions are caught
# automatically (previously nothing ran tests on push).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # matches Streamlit Cloud runtime
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # Scope to the app's declared closure (not the runner's base tools).
          # Fails the build if a CVE lands in a dependency we ship.
          pip-audit -r requirements.txt --progress-spinner off
